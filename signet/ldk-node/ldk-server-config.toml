# Signet ldk-server that issues universal offers (BOLT12 + ssps_rails).
[node]
network = "signet"
listening_addresses = ["0.0.0.0:9737"]
grpc_service_address = "127.0.0.1:3637"
alias = "kaleidopay-signet"

[storage.disk]
dir_path = "./data"

[log]
level = "Info"
log_to_file = true

[esplora]
server_url = "https://mempool.space/signet/api"
